name: Expo APK launch verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/expo-preview-launch.yml
      - mobile/eas-preview-artifact.json
      - mobile/scripts/check-android-launch.mjs
      - mobile/scripts/android-safe-area.mjs
      - mobile/scripts/fetch-eas-preview.mjs
permissions:
  contents: read
concurrency:
  group: expo-preview-launch
  cancel-in-progress: true
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      CHECK_SAFE_AREA: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Download and verify the exact Expo-built APK
        working-directory: mobile
        run: node scripts/fetch-eas-preview.mjs
      - name: Enable emulator acceleration on the isolated runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify two cold launches of the Expo APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 2048M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: cd mobile && node scripts/check-android-launch.mjs
