name: Quality and authorization
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm run check
      - run: npm run format:check
      - run: npm run docs:check
      - run: npm run test:dev-server
      - run: npx expo export --platform android --platform ios
  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    env:
      DO_NOT_TRACK: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: node scripts/prepare-local-maintenance.mjs
      - run: npm run backend:start
      - run: node scripts/install-maintenance.mjs --local
      - run: npm run test:integration
      - if: always()
        run: npm run backend:stop
