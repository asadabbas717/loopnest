project_id = "loopnest"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "1MiB"

[auth]
enabled = true
site_url = "http://localhost:8081"
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.rate_limit]
email_sent = 2
sign_in_sign_ups = 10
token_refresh = 60
