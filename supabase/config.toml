project_id = "loopnest"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "1MiB"

[auth]
enabled = true
site_url = "http://localhost:8081"
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 60
token_refresh = 60

[auth.email.template.confirmation]
subject = "Your Loopnest verification code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Your Loopnest recovery code"
content_path = "./supabase/templates/recovery.html"

[functions.delete-account]
# The handler verifies the bearer with Auth.getUser and reauthenticates the password.
verify_jwt = false

[functions.upload-photo]
# Handler explicitly verifies the bearer with Auth.getUser before claiming work.
verify_jwt = false

[functions.open-photo]
# Explicit Auth.getUser and an atomic recipient-only server claim.
verify_jwt = false

[functions.clear-chat]
# Explicit Auth.getUser; client IDs never select an actor.
verify_jwt = false

[functions.profile-photo]
# Explicit Auth.getUser and rate-limited, one-use upload claims.
verify_jwt = false
